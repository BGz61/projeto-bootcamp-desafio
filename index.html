<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfólio - Borges</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
    }

    header{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
    }

    .container{
      max-width:700px;
    }

    h1{
      font-size:55px;
      margin-bottom:15px;
    }

    h2{
      color:#38bdf8;
      margin-bottom:20px;
      font-weight:normal;
    }

    p{
      font-size:18px;
      line-height:1.6;
      margin-bottom:30px;
      color:#cbd5e1;
    }

    .buttons{
      display:flex;
      justify-content:center;
      gap:15px;
      flex-wrap:wrap;
    }

    .btn{
      text-decoration:none;
      padding:14px 24px;
      border-radius:10px;
      transition:0.3s;
      font-weight:bold;
    }

    .primary{
      background:#38bdf8;
      color:#0f172a;
    }

    .primary:hover{
      background:#0ea5e9;
    }

    .secondary{
      border:2px solid #38bdf8;
      color:#38bdf8;
    }

    .secondary:hover{
      background:#38bdf8;
      color:#0f172a;
    }

    footer{
      text-align:center;
      padding:30px;
      color:#94a3b8;
      border-top:1px solid #1e293b;
    }
  </style>
</head>

<body>

  <header>

      <p>

      </p>

      <div class="buttons">

        <a class="btn primary"
           href="https://www.linkedin.com/in/gabriel-borges-8443a640b/?isSelfProfile=true"
           target="_blank">
           LinkedIn
        </a>

        <a class="btn secondary"
           href="mailto:gabrielllborgesss146@gmail.com">
           Email
        </a>

        <a class="btn secondary"
           href="https://wa.me/5561992192765"
           target="_blank">
           WhatsApp
        </a>

      </div>
    </div>
  </header>

  <footer>

    <p>Telefone: (61) 99219-2765</p>
    <p>LinkedIn: linkedin.com/in/gabriel-borges-8443a640b</p>
  </footer>

</body>
</html>
